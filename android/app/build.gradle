apply plugin: 'com.android.application'

android {
    namespace 'com.marketxai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.marketxai'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
