name: Build MarketX AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android is intentionally NOT used: its
      # v3 action runs `sdkmanager tools`, a package that no longer exists
      # in current SDK repositories, so the step fails. GitHub-hosted
      # ubuntu runners already ship the Android SDK with ANDROID_HOME set.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK with Gradle
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketx-ai-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
